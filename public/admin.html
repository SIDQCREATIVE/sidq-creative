<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>SIDQ Creative admin</title>
<style>
body{background:#0a0a0a;color:#fff;font:15px/1.5 system-ui,sans-serif;max-width:780px;margin:auto;padding:24px}
input,textarea{width:100%;background:#151515;border:1px solid #333;color:#fff;padding:10px;border-radius:8px;margin:4px 0 14px;font:inherit}
label{display:block;color:#aaa;font-size:13px}
h2{margin:32px 0 8px}
button{background:#b7e222;border:0;border-radius:99px;padding:12px 26px;font:700 15px system-ui,sans-serif;cursor:pointer}
.r{display:grid;grid-template-columns:1fr 2fr;gap:10px}
table{width:100%;font-size:13px;border-collapse:collapse}
td{border-top:1px solid #222;padding:8px 6px;vertical-align:top;word-break:break-word}
#msg{color:#b7e222;margin-left:12px}#le{color:#f87171;margin-left:12px}
.bar{position:sticky;bottom:0;background:#0a0a0af0;padding:14px 0}
.tabs2{display:flex;gap:8px;margin:8px 0 12px}.tabs2 button{background:#151515;color:#fff;border:1px solid #333}.tabs2 button.on{background:#b7e222;color:#000}.tabs2 b{background:#f87171;color:#000;border-radius:99px;padding:0 8px;margin-left:6px}.tabs2 b:empty{display:none}
</style>
</head>
<body>
<h1>SIDQ Creative admin</h1>

<form id="lg">
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required>
  <button>Log in</button><span id="le" role="alert"></span>
</form>

<div id="ed" hidden>
  <div class="tabs2"><button data-k="home">Overview</button><button data-k="customer">Customers <b id="nc"></b></button><button data-k="clipper">Clippers <b id="nk"></b></button><button data-k="content">Content</button><button data-k="blog">Blog</button></div>
  <div data-pg="home"><h2>Overview</h2><div id="ov"></div></div>
  <div data-pg="content"><div id="f"></div>
  <div class="bar"><button id="sv">Save changes</button><span id="msg" role="status"></span></div></div>
  <div data-pg="blog"><h2>Blog (SEO)</h2>
  <label>Title<input id="bt"></label>
  <label>Short description for Google (about 150 characters)<input id="bd" maxlength="300"></label>
  <label>Text (empty line between paragraphs, start a line with ## for a heading)<textarea id="bb" rows="10"></textarea></label>
  <button id="bp">Publish post</button><span id="bm" role="status"></span>
  <div id="bl"></div></div>
  <div data-pg="customer clipper"><h2 id="ph"></h2><div id="ls"></div></div>
</div>

<script>
const $=s=>document.querySelector(s);
const L={heroA:'Hero line 1 (white)',heroB:'Hero line 2 (grey)',sub:'Hero paragraph',whyH:'Why section title',why:'Why section text',fName:'Founder name',fRole:'Founder title',f1:'Founder number 1',f1l:'Number 1 label',f2:'Founder number 2',f2l:'Number 2 label',fImg:'Founder photo, black and white',fImg2:'Founder photo, color (shows on hover)',p1:'Price, Clip-Only Engine',p2:'Price, Distribution Network',p3:'Price, B2B Pipeline',wa:'WhatsApp number (digits only, with country code)',ig:'Instagram username',whop:'Whop link',discord:'Discord invite link (full link)',email:'Contact email'};
let tok=sessionStorage.k,D;
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const api=(u,m='GET',b)=>fetch(u,{method:m,headers:{'Content-Type':'application/json','x-token':tok||''},body:b&&JSON.stringify(b)})
  .then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw j.error||'Something went wrong';return j});

async function load(){
  try{
    const ls=await api('/api/leads');D=await api('/api/content');
    $('#lg').hidden=true;$('#ed').hidden=false;
    $('#f').innerHTML='<h2>Texts</h2>'
      +[...new Set([...Object.keys(D.t),'fImg','fImg2','p1','p2','p3','wa','ig','whop','discord'])].map(k=>`<label>${L[k]||k}<input data-k="${k}" value="${esc(D.t[k]||'')}"></label>`).join('')
      +'<h2>Numbers</h2>'
      +D.stats.map((s,i)=>`<div class="r"><label>Number<input data-v="${i}" value="${esc(s.v)}"></label><label>Label<input data-l="${i}" value="${esc(s.l)}"></label></div>`).join('')
      +`<h2>Popular shorts carousel</h2><label>One per line: a YouTube Shorts link, or /videos/file.mp4 | Client name (5 to 100)<textarea id="sh" rows="10">${esc(D.shorts.join('\n'))}</textarea></label>`;
    LS=ls;go(location.hash.slice(1)||'home');
    posts();
  }catch(e){$('#ed').hidden=true;$('#lg').hidden=false;if(tok)$('#le').textContent=e}
}

$('#lg').onsubmit=async e=>{
  e.preventDefault();
  try{tok=(await api('/api/login','POST',{password:$('#pw').value})).token;sessionStorage.k=tok;$('#le').textContent='';load()}
  catch(x){$('#le').textContent=x}
};

$('#sv').onclick=async()=>{
  document.querySelectorAll('[data-k]').forEach(i=>D.t[i.dataset.k]=i.value);
  document.querySelectorAll('[data-v]').forEach(i=>D.stats[i.dataset.v].v=i.value);
  document.querySelectorAll('[data-l]').forEach(i=>D.stats[i.dataset.l].l=i.value);
  D.shorts=$('#sh').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,100);
  try{await api('/api/content','PUT',D);$('#msg').textContent='Saved. Refresh the site to see it.'}
  catch(e){$('#msg').textContent=e}
};

let LS=[],tab='home',T;
function badge(){const n=t=>LS.filter(l=>l.type===t&&!l.seen).length,c=n('customer'),k=n('clipper');
  $('#nc').textContent=c||'';$('#nk').textContent=k||'';document.title=(c+k?'('+(c+k)+') ':'')+'SIDQ Creative admin'}
function showLeads(){
  badge();document.querySelectorAll('.tabs2 button').forEach(b=>b.classList.toggle('on',b.dataset.k===tab));
  const rows=LS.filter(l=>l.type===tab);
  $('#ls').innerHTML=rows.length?`<table>${rows.map(l=>`<tr><td>${l.seen?'':'<b style="color:#b7e222">NEW</b><br>'}${esc(new Date(l.at).toLocaleString())}</td><td>${esc(l.name)}<br>${esc(l.email)}<br>${esc(l.phone)}</td><td>${tab==='clipper'?'Edits: ':'Budget: '}${esc(l.budget)}<br>${esc(l.msg)}</td><td><button data-dl="${l.id}" style="padding:4px 12px;background:#7f1d1d;color:#fff">Delete</button></td></tr>`).join('')}</table>`:'<p>No applications yet.</p>';
  clearTimeout(T);T=setTimeout(async()=>{if(LS.some(l=>l.type===tab&&!l.seen)){const t=tab;try{await api('/api/leads/seen','POST',{type:t});LS.forEach(l=>{if(l.type===t)l.seen=true});badge()}catch{}}},4000)}
document.querySelectorAll('.tabs2 button').forEach(b=>b.onclick=()=>go(b.dataset.k));
function go(k){tab=k;location.hash=k;
  document.querySelectorAll('[data-pg]').forEach(d=>d.hidden=!d.dataset.pg.split(' ').includes(k));
  document.querySelectorAll('.tabs2 button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  $('#ph').textContent=k==='clipper'?'Clipper applications':'Customer applications';
  $('#ov').innerHTML=['customer','clipper'].map(t=>`<p><b>${LS.filter(l=>l.type===t).length}</b> ${t} applications, <b>${LS.filter(l=>l.type===t&&!l.seen).length}</b> new</p>`).join('');
  if(k==='customer'||k==='clipper')showLeads();else badge()}
$('#ls').onclick=async e=>{const id=e.target.dataset.dl;if(id&&confirm('Delete this application?')){await api('/api/leads/'+id,'DELETE');LS=LS.filter(l=>l.id!=id);showLeads()}};
setInterval(async()=>{if(!tok||$('#ed').hidden)return;try{LS=await api('/api/leads');go(tab)}catch{}},30000);
async function posts(){const p=await api('/api/posts');$('#bl').innerHTML=p.map(x=>`<p><a style="color:#b7e222" href="/blog/${esc(x.slug)}" target="_blank">${esc(x.title)}</a> <button data-del="${x.id}" style="padding:4px 12px;background:#7f1d1d;color:#fff">Delete</button></p>`).join('')}
$('#bp').onclick=async()=>{try{const r=await api('/api/posts','POST',{title:$('#bt').value,descr:$('#bd').value,body:$('#bb').value});$('#bm').textContent='Published: /blog/'+r.slug;['bt','bd','bb'].forEach(i=>$('#'+i).value='');posts()}catch(e){$('#bm').textContent=e}};
$('#bl').onclick=async e=>{const id=e.target.dataset.del;if(id&&confirm('Delete this post?')){await api('/api/posts/'+id,'DELETE');posts()}};

if(tok)load();
</script>
</body>
</html>
